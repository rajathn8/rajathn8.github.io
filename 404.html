<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Rajath Rao</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
  <style>
    :root { --orange:#e85d04; --orange2:#ff6b35; --ink:#1a1a1a; --muted:#666; --bg:#fffaf5; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem;
      background:var(--bg); color:var(--ink); text-align:center;
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    .code {
      font-size:clamp(5rem,20vw,9rem); font-weight:800; line-height:1; margin:0;
      background:linear-gradient(120deg,var(--orange),var(--orange2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    h2 { margin:.5rem 0 0; font-size:clamp(1.2rem,4vw,1.6rem); }
    p { color:var(--muted); max-width:32rem; margin:.75rem auto 1.75rem; }
    .btn {
      display:inline-block; padding:.8rem 1.5rem; border-radius:999px; text-decoration:none;
      font-weight:700; color:#fff; background:linear-gradient(120deg,var(--orange),var(--orange2));
      box-shadow:0 8px 24px rgba(232,93,4,.25); transition:transform .15s ease;
    }
    .btn:hover { transform:translateY(-2px); }
    .links { margin-top:1.5rem; font-size:.95rem; }
    .links a { color:var(--orange); text-decoration:none; margin:0 .5rem; }
    .links a:hover { text-decoration:underline; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f0d0b; --ink:#f5efe9; --muted:#a89b8f; }
    }
  </style>
</head>

    <p class="code">404</p>

    <div class="links">
      <a href="/about.html">About</a>·
      <a href="/resume.html">Resume</a>·

    </div>
  </main>
</body>
</html>
